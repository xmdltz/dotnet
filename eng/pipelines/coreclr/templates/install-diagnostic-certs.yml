parameters:
  isOfficialBuild: false
  certNames: []
  vaultName: ''
  azureSubscription: ''
  scriptRoot: '$(Build.SourcesDirectory)'
  esrpClientVersion: ''  # Optional: specify exact version for additional security (e.g., '1.2.76')

steps:
- ${{ if and(eq(parameters.isOfficialBuild, true), ne(variables['Build.Reason'], 'PullRequest'), or(startswith(variables['Build.SourceBranch'], 'refs/heads/release/'), startswith(variables['Build.SourceBranch'], 'refs/heads/internal/release/'), startswith(variables['Build.SourceBranch'], 'refs/heads/reltest/')), not(endsWith(variables['Build.SourceBranch'], '-staging'))) }}:
  - task: AzureKeyVault@2
    inputs:
      azureSubscription: ${{ parameters.azureSubscription }}
      KeyVaultName: ${{ parameters.vaultName }}
      SecretsFilter: ${{ join(',', parameters.certNames) }}
    displayName: 'Download secrets: Diagnostic Certificates'

  - task: NuGetCommand@2
    displayName: Install ESRPClient Tool
    inputs:
      command: 'custom'
      arguments: 'install microsoft.esrpclient
                ${{ if ne(parameters.esrpClientVersion, '') }}
                -Version ${{ parameters.esrpClientVersion }}
                ${{ else }}
                -DependencyVersion Highest
                ${{ endif }}
                -Source https://dnceng.pkgs.visualstudio.com/_packaging/MicroBuildToolset/nuget/v3/index.json
                -OutputDirectory $(Build.StagingDirectory)'

  - powershell: |
      eng/pipelines/install-diagnostic-certs.ps1 "${{ join(',', parameters.certNames) }}"
      $esrpclient = Get-ChildItem -Path '$(Build.StagingDirectory)\microsoft.esrpclient*' -Filter esrpclient.exe -Recurse | Select-Object -First 1 | select -ExpandProperty FullName

      if ($esrpclient -eq $null) {
        throw "Failed to find esrpclient.exe in $(Build.StagingDirectory)"
      }

      # Verify the ESRP client executable is signed by Microsoft before use
      Write-Host "Verifying signature of ESRP client: $esrpclient"
      $signature = Get-AuthenticodeSignature -FilePath $esrpclient
      
      if ($signature.Status -ne 'Valid') {
        throw "ESRP client executable signature is not valid. Status: $($signature.Status)"
      }
      
      $signerCert = $signature.SignerCertificate
      if ($null -eq $signerCert) {
        throw "ESRP client executable is not signed"
      }
      
      # Verify the certificate is issued by Microsoft
      $expectedIssuerPattern = "CN=Microsoft.*"
      if ($signerCert.Issuer -notmatch $expectedIssuerPattern) {
        throw "ESRP client executable is not signed by Microsoft. Issuer: $($signerCert.Issuer)"
      }
      
      # Verify the subject contains Microsoft Corporation
      if ($signerCert.Subject -notmatch "O=Microsoft Corporation") {
        throw "ESRP client executable certificate subject does not contain Microsoft Corporation. Subject: $($signerCert.Subject)"
      }
      
      # Verify the certificate chain is valid
      $chain = New-Object System.Security.Cryptography.X509Certificates.X509Chain
      $chain.ChainPolicy.RevocationMode = [System.Security.Cryptography.X509Certificates.X509RevocationMode]::Online
      $chain.ChainPolicy.RevocationFlag = [System.Security.Cryptography.X509Certificates.X509RevocationFlag]::ExcludeRoot
      $chain.ChainPolicy.VerificationFlags = [System.Security.Cryptography.X509Certificates.X509VerificationFlags]::NoFlag
      
      if (-not $chain.Build($signerCert)) {
        $chainErrors = $chain.ChainStatus | ForEach-Object { $_.StatusInformation }
        throw "ESRP client executable certificate chain validation failed: $($chainErrors -join '; ')"
      }
      
      Write-Host "ESRP client signature verified successfully"
      Write-Host "  Subject: $($signerCert.Subject)"
      Write-Host "  Issuer: $($signerCert.Issuer)"
      Write-Host "  Thumbprint: $($signerCert.Thumbprint)"

      $signArgs = "/p:DotNetEsrpToolPath=$esrpclient"
      echo "##vso[task.setvariable variable=_SignDiagnosticFilesArgs;]$signArgs"
    displayName: 'Install diagnostic certificates'
    workingDirectory: ${{ parameters.scriptRoot }}
    env:
      ${{ each cert in parameters.certNames }}:
        ${{ cert }}: $(${{ cert }})
